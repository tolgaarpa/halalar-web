<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halalar</title>

<style>
:root{--ink:#f2efe9;--paper:#0b0b0d;--accent:#e8201c;--muted:#8d887f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;overscroll-behavior:none;touch-action:none;height:100%;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif}
body{height:100vh;overflow:hidden}
body.locked{overflow:hidden}
#cover{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 1s,visibility 1s}
#cover.gone{opacity:0;visibility:hidden}
.small{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
#cover h1{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:300;font-size:clamp(54px,11vw,170px);letter-spacing:-.03em;line-height:.9;text-align:center}
#cover p{font-family:Anton,sans-serif;text-transform:uppercase;font-style:italic;font-weight:300;font-size:clamp(18px,2.4vw,28px);color:#333}
#cover button{border:1px solid var(--ink);background:none;padding:14px 38px;border-radius:3px;font:500 13px/1 Barlow;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.3s}
#cover button:hover{background:var(--ink);color:#fff}
nav{position:fixed;top:0;left:0;right:0;z-index:60;transform:translateZ(0);text-shadow:0 1px 8px rgba(0,0,0,.9);display:flex;justify-content:space-between;align-items:center;padding:22px 32px;pointer-events:none}
nav .logo{font-family:Anton,sans-serif;text-transform:uppercase;font-size:17px;letter-spacing:-.01em;color:#cfcac1;text-decoration:none;pointer-events:auto;margin-top:4px}
nav .marka{display:flex;flex-direction:column;align-items:flex-start}
nav .hit{pointer-events:auto;font-family:Anton,sans-serif;text-transform:uppercase;font-size:28px;letter-spacing:-.02em;color:#ff5a1f;text-decoration:none;line-height:1}
nav .depth{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
/* ---- tünel ---- */
#world{position:fixed;inset:0;z-index:1;isolation:isolate;perspective:600px;perspective-origin:50% 50%;overflow:hidden}
#cam{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.obj{position:absolute;left:50%;top:50%;transform-style:preserve-3d;cursor:pointer;pointer-events:auto;will-change:transform,opacity}
.obj img{display:block;width:100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7));pointer-events:auto}

.vignette{display:none}
/* detay kartı */
#card{position:fixed;z-index:45;background:#f2efe9;color:#111;padding:10px 13px;border-radius:3px;width:210px;z-index:70;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#card.on{opacity:1;transform:none}
#card .k{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#666}
#card h3{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:18px;letter-spacing:-.01em;margin:3px 0 4px;line-height:1.1}
#card p{font-size:12px;color:#333;line-height:1.35}
#card .go{display:block;margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#111}
.hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);z-index:40;transition:.6s}
.hint.off{opacity:0}
#end{position:fixed;inset:0;display:grid;place-items:center;z-index:30;opacity:0;pointer-events:none;transition:.8s;font-family:Anton,sans-serif;text-transform:uppercase;font-weight:600;font-size:clamp(70px,20vw,320px);letter-spacing:-.05em;color:var(--accent)}
#end.on{opacity:1}
/* arama */
nav .sag{display:flex;gap:18px;align-items:center}
nav .ara-ac{pointer-events:auto;background:none;border:1px solid #444;color:var(--ink);border-radius:3px;padding:9px 18px;font:500 12px Barlow;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
nav .ara-ac:hover{border-color:var(--ink)}
#ara{position:fixed;inset:0;z-index:80;background:rgba(11,11,13,.97);display:none;flex-direction:column;touch-action:pan-y}
#ara.on{display:flex}
#ara .ust2{display:flex;gap:12px;align-items:center;padding:22px 32px 12px;max-width:1200px;width:100%;margin:0 auto}
#ara input{flex:1;min-width:0;background:#17171b;border:1px solid #2a2a30;color:var(--ink);border-radius:3px;padding:13px 20px;font:400 16px Barlow;outline:none}
#ara .kapat{background:none;border:1px solid #444;color:var(--ink);border-radius:3px;padding:12px 18px;font:500 12px Barlow;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
#ara .katlar{display:flex;gap:8px;flex-wrap:wrap;padding:4px 32px 16px;max-width:1200px;width:100%;margin:0 auto}
#ara .katlar button{background:none;border:1px solid #2a2a30;color:#aaa;border-radius:3px;padding:8px 14px;font:500 12px Barlow;cursor:pointer}
#ara .katlar button.on{background:var(--ink);color:#111;border-color:var(--ink)}
#ara .sonuc{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:4px 32px 40px;max-width:1200px;width:100%;margin:0 auto;align-content:start;touch-action:pan-y}
#ara .oge{background:#141417;border:1px solid #222;border-radius:3px;padding:12px;color:var(--ink);text-decoration:none;display:block}
#ara .oge:hover{border-color:#555}
#ara .oge img{width:100%;aspect-ratio:1;object-fit:contain;display:block;margin-bottom:10px}
#ara .oge b{display:block;font-weight:500;font-size:14px;line-height:1.25}
#ara .oge small{display:block;color:#888;font-size:11px;margin-top:4px}
#ara .yok{grid-column:1/-1;color:#888;text-align:center;padding:40px 0}
@media(max-width:600px){#ara .ust2,#ara .katlar,#ara .sonuc{padding-left:16px;padding-right:16px}#ara .sonuc{grid-template-columns:repeat(2,1fr);gap:10px}nav{padding:18px 16px}}

/* Hit Pazarı logosu: kırmızı çift eğik çizgi + HİT PAZARI (her sayfanın sol üstünde) */
html{font-synthesis:none}
.hpi-sol{display:flex;align-items:center;gap:12px;min-width:0}
.hp-logo{display:inline-flex;align-items:center;gap:.36em;flex:none;text-decoration:none;pointer-events:auto;color:#f2efe9;font:400 22px/1 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;white-space:nowrap;text-shadow:none}
.hp-logo .hp-c{color:#e8201c;font-size:1.1em;letter-spacing:-.04em;transform:skewX(-14deg)}
/* vintage dili: Anton başlık, Barlow gövde, kırmızı vurgu */
nav .logo{font:700 15px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#cfcac1;margin-top:0;padding-left:12px;border-left:1px solid #55555e}
nav .depth,.hint{font-family:"Barlow Condensed",sans-serif;font-weight:700}
nav .ara-ac,#ara .kapat{border-color:#55555e;font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.2em}
#ara .katlar button{font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
#ara .oge{background:#141418;border-color:#26262c}
#ara .oge b{font-weight:600}
#card{background:#ece5d2}
#card h3{font-size:20px;letter-spacing:.01em;line-height:1.12}
#card .go{color:#e8201c;font-weight:700}
#end{font-weight:400;letter-spacing:0;transform:skewX(-8deg)}
nav{background:linear-gradient(#0b0b0de6,#0b0b0d00);padding-bottom:34px}
nav .hp-logo{text-shadow:0 1px 8px rgba(0,0,0,.9)}
@media(max-width:600px){.hp-logo{font-size:19px}nav .logo{font-size:13px;letter-spacing:.16em;padding-left:9px}nav .sag{gap:10px}.hpi-sol{gap:9px}}

/* tünel başlığı: Hit Pazarı logosu 2 kat, dükkân adı alt satırda 3 kat büyük ve kırmızı */
.hpi-sol{flex-direction:column;align-items:flex-start;gap:18px}
nav .hp-logo{font-size:85px}
nav .logo{font:400 102px/1.08 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#e8201c;border-left:0;padding-left:0;margin-top:0}
@media(max-width:600px){.hpi-sol{gap:10px}nav .hp-logo{font-size:55px}nav .logo{font-size:84px;letter-spacing:0}nav .ara-ac{font-size:22px!important;padding:12px 18px!important}}
nav .ara-ac{font-size:28px!important;padding:18px 36px!important;letter-spacing:.16em!important}
/* ara: dükkân içi gibi beyaz, çerçevesiz, dekupe ürünler */
#ara{background:#fff;color:#111114}
#ara input{background:#fff;border:0;border-bottom:2px solid #111114;border-radius:0;color:#111114;font:500 20px Barlow;padding:12px 2px}
#ara input::placeholder{color:#8a8a92}
#ara .kapat{border-color:#c9c9d0;color:#111114}
#ara .katlar button{border-color:#c9c9d0;color:#111114;background:#fff}
#ara .katlar button.on{background:#e8201c;border-color:#e8201c;color:#fff}
#ara .sonuc{gap:30px 22px}
#ara .oge{background:none;border:0;border-radius:0;padding:0;color:#111114;text-align:center}
#ara .oge:hover{border:0}
#ara .oge img{padding:8%;filter:drop-shadow(0 12px 14px rgba(0,0,0,.14));transition:transform .3s cubic-bezier(.2,.8,.2,1)}

#ara .oge:hover b{color:#e8201c}
#ara .oge small{color:#77777f}
#ara .yok{color:#77777f}

<body>
<nav><span class="hpi-sol"><a class="hp-logo" href="hit.html" aria-label="Hit Pazarı"><span class="hp-c" aria-hidden="true">//</span><span class="hp-a">HİT PAZARI</span></a><a class="logo" href="#">Halalar</a></span><span class="sag"><span class="depth" id="depth">0 m</span><button class="ara-ac" id="araAc">Ara</button></span></nav>
<div id="world"><div id="cam"></div></div>
<div class="vignette"></div>
<div id="card"><div class="k" id="c-k"></div><h3 id="c-h"></h3><p id="c-p"></p><span class="go">Ürün sayfası →</span></div>
<div class="hint" id="hint">kaydır ↓ içeri gir</div>
<div id="end">halalar</div>
<div id="ara"><div class="ust2"><input id="araKutu" type="search" placeholder="Ürün ara: plak, tablo, porselen…" autocomplete="off"><button class="kapat" id="araKapat">Kapat</button></div>
<div class="katlar" id="katlar"></div><div class="sonuc" id="sonuc"></div></div>
<script src="veri/urunler.js"></script>
<script src="veri/aspect.js"></script>
<script src="veri/galeri.js"></script>
<script src="veri/kategoriler.js"></script>
<script src="veri/kategori-ikon.js"></script>
<script>
// Kategori modu (?mod=kategori): aynı tünel, ürün yerine kategorilerin ikonik görselleri; dokununca o kategori açılır
const KMOD=new URLSearchParams(location.search).get('mod')==='kategori'&&typeof KATEGORI_IKON!=='undefined';
// her tekrar turunda kategori kendi içinden başka bir ürünle gelir (ilk turda ikonik görsel)
const KSEC=new URLSearchParams(location.search).get('kat');
const KFILTRE=!KMOD&&KSEC&&typeof KATEGORI!=='undefined'?URUNLER.filter(u=>KATEGORI[u[0]]===KSEC):null;
if(KFILTRE&&KFILTRE.length){document.querySelector('nav .logo').textContent=KSEC;document.title='Hit Pazarı · '+KSEC}
const KAYNAK=KMOD?(()=>{const L=[],ks=Object.keys(KATEGORI_IKON);
  const uy=k=>URUNLER.filter(u=>KATEGORI[u[0]]===k&&u[0]!==KATEGORI_IKON[k]).map(u=>u[0]);
  for(let t=0;t<8;t++)ks.forEach(k=>{const d=uy(k);const id=t===0||!d.length?KATEGORI_IKON[k]:d[(t-1)%d.length];L.push([id,k,'Bu kategorideki ürünleri gör','—'])});return L})():(KFILTRE&&KFILTRE.length?KFILTRE:URUNLER);
if(KMOD){document.querySelector('nav .logo').textContent='Kategoriler';document.getElementById('end').textContent='kategoriler';document.title='Hit Pazarı · Kategoriler';document.querySelector('#card .go').textContent='Ürünleri gör →'}
// Her ürüne tünelde bir yer: z (derinlik), x/y (yana ofset), boyut. Deterministik dağılım.
const STEP=KMOD?110:32;                        // ürünler arası derinlik
const TEKRAR=12;                      // liste tekrarı: tünel uzun ve dolu
const P=600;                          // perspektif (eski CSS ile aynı)
const BG='#0b0b0d';
// --- tuval: bütün tünel tek yüzeye çizilir (katman/bellek sorunu yok) ---
const world=document.getElementById('world'); world.innerHTML='';
const cv=document.createElement('canvas'); cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
world.appendChild(cv); const g=cv.getContext('2d');
let DPR=1,VW=0,VH=0;
function boyut(){DPR=Math.min(window.devicePixelRatio||1,1.5);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR)}
boyut(); addEventListener('resize',boyut);
// --- görseller: her ürün bir kez yüklenir, alfa haritası çıkarılır ---
const IMG={}, ALPHA={}, KOPYA={};
KAYNAK.forEach(u=>{ if(IMG[u[0]])return; const im=new Image(); im.src=`kaynak/web/${u[0]}.webp`; IMG[u[0]]=im;
  im.decode().then(()=>{const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);ALPHA[u[0]]=x.getImageData(0,0,48,48).data;
    // küçük kopyalar: uzaktaki ürün büyük resimden değil küçük kopyadan çizilir (takılmayı önler)
    const L=[];for(const m of [96,192,384,640]){const s=m/Math.max(im.naturalWidth,im.naturalHeight);if(s>=1)break;const k=document.createElement('canvas');k.width=Math.max(1,Math.round(im.naturalWidth*s));k.height=Math.max(1,Math.round(im.naturalHeight*s));k.getContext('2d').drawImage(im,0,0,k.width,k.height);L.push(k)}
    KOPYA[u[0]]=L}).catch(()=>{}) });
function kaynak(id,px){const L=KOPYA[id];if(L)for(const k of L)if(Math.max(k.width,k.height)>=px)return k;return IMG[id]}
// --- yerleşim (önceki ile aynı kurallar) ---
const LISTE=[];for(let t=0;t<(KMOD?1:Math.max(TEKRAR,Math.ceil(60/KAYNAK.length)));t++)KAYNAK.forEach(u=>LISTE.push(u));
const N=LISTE.length;
const items=LISTE.map((u,i)=>{
  const ar=ASPECT[u[0]]||1;
  const X=1.4, Y=1.35, per=2*(2*X+2*Y);            // çerçeve çevresine eşit dağılım
  const p=((i*0.6180339)%1)*per;
  const inn=((i*0.4142)%1)*0.35;
  let xv,yv;
  if(p<2*X){xv=-X+p; yv=-Y+inn}
  else if(p<2*X+2*Y){xv=X-inn; yv=-Y+(p-2*X)}
  else if(p<4*X+2*Y){xv=X-(p-2*X-2*Y); yv=Y-inn}
  else {xv=-X+inn; yv=Y-(p-4*X-2*Y)}
  const w=((ar>1.25?460:ar<0.75?300:380)+((i*13)%6)*45)*(KMOD?1.25:1);   // kategori modunda ikonlar bir tık büyük
  const z=-(i*STEP)-250;
  let rot=0;
  if(ar<0.75){ const mag=9+((i*0.7548)%1)*11; const side=Math.abs(xv)>Math.abs(yv)?Math.sign(xv):(((i*0.31)%1)<0.5?-1:1); rot=-side*mag; }
  else rot=(((i*0.5698)%1)-0.5)*4;
  return {i,u,x:xv,y:yv,z,w,ar,rot:rot*Math.PI/180,thin:(i%3!==0),
          sx:0,sy:0,sw:0,sh:0,op:0,dz:0};
});
const TOTAL=(N+1)*STEP;
const THIN_Z=1100;
let mx=0,my=0; addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)});
let camZ=0,target=0,open=true;
const clamp=v=>Math.min(Math.max(v,0),TOTAL);
addEventListener('wheel',e=>{if(!open)return;e.preventDefault();
  if(Math.abs(e.deltaY)<2)return;
  if(target<=0&&e.deltaY<0){target=0;return}
  target=clamp(target+e.deltaY*1.4)},{passive:false});
let ty=null;addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(!open||ty===null)return;const y=e.touches[0].clientY;target=clamp(target+(ty-y)*3);ty=y;e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if(!open)return;if(e.key==='ArrowDown'||e.key===' '||e.key==='PageDown')target=clamp(target+400);if(e.key==='ArrowUp'||e.key==='PageUp')target=clamp(target-400)});
let drawn=[];                       // bu karede çizilenler, uzaktan yakına
function render(){
  camZ+=(target-camZ)*0.12; if(Math.abs(target-camZ)<0.05)camZ=target;
  document.getElementById('depth').textContent=Math.round(camZ/40)+' m';
  document.getElementById('hint').classList.toggle('off',camZ>200);
  const cx=mx*-60, cy=my*-40;
  drawn=[];
  for(const it of items){
    const dz=it.z+camZ; it.dz=dz;
    if(dz>250||dz<-7000)continue;
    let vis=1;
    if(dz>0) vis*=Math.max(0,(250-dz)/250);
    if(dz<-5500) vis*=Math.max(0,(7000+dz)/1500);
    if(it.thin) vis*=Math.min(1,Math.max(0,(dz+THIN_Z+500)/500));
    if(vis<=0.01)continue;
    const im=IMG[it.u[0]]; if(!im.complete||!im.naturalWidth)continue;
    const fog=Math.min(1,Math.max(0,(-dz-2000)/10000));
    const k=P/(P-dz);
    it.op=(1-fog*0.6)*vis;
    it.sw=it.w*k; it.sh=it.sw*im.naturalHeight/im.naturalWidth;
    it.sx=VW/2+(it.x*VW*0.5+cx)*k; it.sy=VH/2+(it.y*VH*0.5+cy)*k;
    if(it.sx+it.sw<-50||it.sx-it.sw>VW+50||it.sy+it.sh<-50||it.sy-it.sh>VH+50)continue;  // ekran dışı
    drawn.push(it);
  }
  drawn.sort((a,b)=>a.dz-b.dz);
  g.setTransform(DPR,0,0,DPR,0,0); g.globalAlpha=1; g.fillStyle=BG; g.fillRect(0,0,VW,VH);
  for(const it of drawn){
    g.save(); g.globalAlpha=it.op; g.translate(it.sx,it.sy); g.rotate(it.rot);
    g.drawImage(kaynak(it.u[0],Math.max(it.sw,it.sh)*DPR),-it.sw/2,-it.sh/2,it.sw,it.sh); g.restore();
    if(KMOD&&it.op>.25&&it.sw>70&&it.dz>-1400){const fs=Math.max(14,Math.min(72,it.sw*.15));g.save();g.globalAlpha=it.op;g.font=fs+'px Anton, Impact, sans-serif';g.textAlign='center';g.textBaseline='top';g.shadowColor='#000';g.shadowBlur=14;g.fillStyle='#f2efe9';g.fillText(it.u[1].toLocaleUpperCase('tr-TR'),it.sx,it.sy+it.sh/2+fs*.35);g.restore()}
  }
  document.getElementById('end').classList.toggle('on',camZ>TOTAL-STEP*1.2);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
// --- seçim: o noktada gerçekten görünen, en öndeki ürün ---
const card=document.getElementById('card'); let hoverT=null,hot=null;
function pickIs(it,x,y){
  const d=ALPHA[it.u[0]]; if(!d||it.op<0.05)return false;
  const dx=x-it.sx, dy=y-it.sy, c=Math.cos(it.rot), s=Math.sin(it.rot);
  const lx_=dx*c+dy*s, ly_=-dx*s+dy*c;                 // eğimi geri al
  const u=Math.floor((lx_/it.sw+0.5)*48), v=Math.floor((ly_/it.sh+0.5)*48);
  if(u<0||u>47||v<0||v>47)return false; return d[(v*48+u)*4+3]>40}
function pick(x,y){ for(let j=drawn.length-1;j>=0;j--){ if(pickIs(drawn[j],x,y))return drawn[j] } return null }
function showCard(it){card.style.left=Math.min(lx+16,innerWidth-230)+'px';card.style.top=Math.min(ly+16,innerHeight-110)+'px';document.getElementById('c-k').textContent=KMOD?'Kategori':[(typeof KATEGORI!=='undefined'&&KATEGORI[it.u[0]])||'',it.u[3]==='—'?'':it.u[3]].filter(Boolean).join(' · ');document.getElementById('c-h').textContent=it.u[1];document.getElementById('c-p').textContent=it.u[2];card.classList.add('on')}
let cand=null,candT=0,offT=null;
function setHot(o){
  if(o===hot){clearTimeout(offT);offT=null;cand=null;return}
  if(!o){ if(!offT) offT=setTimeout(()=>{hot=null;cand=null;card.classList.remove('on');cv.style.cursor='';offT=null},250); return }
  clearTimeout(offT);offT=null;
  const now=performance.now(); if(o!==cand){cand=o;candT=now;return}
  if(now-candT<220)return;
  hot=o; cv.style.cursor='pointer'; clearTimeout(hoverT);
  if(card.classList.contains('on'))showCard(o); else hoverT=setTimeout(()=>{if(hot===o)showCard(o)},250)}
function nearHot(x,y){if(!hot||!drawn.includes(hot))return false;for(const [ox,oy] of [[0,0],[7,0],[-7,0],[0,7],[0,-7],[5,5],[-5,5],[5,-5],[-5,-5]])if(pickIs(hot,x+ox,y+oy))return true;return false}
let lx=-1,ly=-1;
function hover(){if(lx<0)return;let o=pick(lx,ly);if(!o&&nearHot(lx,ly))o=hot;setHot(o)}
addEventListener('mousemove',e=>{lx=e.clientX;ly=e.clientY;hover()});
setInterval(hover,90);
cv.addEventListener('click',e=>{const o=pick(e.clientX,e.clientY);if(o)location.href=KMOD?'index.html?kat='+encodeURIComponent(o.u[1]):'urun.html?id='+encodeURIComponent(o.u[0])});
addEventListener('mousemove',e=>{if(!card.classList.contains('on'))return;const x=Math.min(e.clientX+16,innerWidth-230),y=Math.min(e.clientY+16,innerHeight-110);card.style.left=x+'px';card.style.top=y+'px'});
target=parseFloat(new URLSearchParams(location.search).get('z')||0);

// --- arama ve kategoriler ---
(()=>{const KAT=id=>(typeof KATEGORI!=='undefined'&&KATEGORI[id])||'';
  const kutu=document.getElementById('araKutu'),kl=document.getElementById('katlar'),so=document.getElementById('sonuc'),pen=document.getElementById('ara');let kat='';
  const norm=t=>(t||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  kl.innerHTML=['',...(typeof KATEGORILER!=='undefined'?KATEGORILER:[])].map(k=>`<button data-k="${esc(k)}" class="${k?'':'on'}">${k?esc(k):'Tümü'}</button>`).join('');
  kl.onclick=e=>{const b=e.target.closest('button');if(!b)return;kat=b.dataset.k;kl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));goster()};
  function goster(){const q=norm(kutu.value).trim();
    const L=URUNLER.filter(u=>(!kat||KAT(u[0])===kat)&&(!q||q.split(/\s+/).every(w=>norm(u[1]+' '+u[2]+' '+u[3]+' '+KAT(u[0])).includes(w))));
    so.innerHTML=L.length?L.map(u=>`<a class="oge" href="urun.html?id=${encodeURIComponent(u[0])}"><img loading="lazy" src="kaynak/web/${u[0]}.webp" alt=""><b>${esc(u[1])}</b><small>${esc([KAT(u[0]),u[3]==='—'?'':u[3]].filter(Boolean).join(' · '))}</small></a>`).join(''):'<div class="yok">Sonuç yok</div>'}
  kutu.oninput=goster;
  document.getElementById('araAc').onclick=()=>{pen.classList.add('on');open=false;card.classList.remove('on');goster();setTimeout(()=>kutu.focus(),50)};
  document.getElementById('araKapat').onclick=()=>{pen.classList.remove('on');open=true};
  addEventListener('keydown',e=>{if(e.key==='Escape'&&pen.classList.contains('on'))document.getElementById('araKapat').click()});
})();

</script>

<style>
:root{--ink:#f2efe9;--paper:#0b0b0d;--accent:#e8201c;--muted:#8d887f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;overscroll-behavior-y:none;overscroll-behavior-x:auto;touch-action:none;height:100%;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif}
body{height:100vh;overflow:hidden}
body.locked{overflow:hidden}
#cover{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 1s,visibility 1s}
#cover.gone{opacity:0;visibility:hidden}
.small{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
#cover h1{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:300;font-size:clamp(54px,11vw,170px);letter-spacing:-.03em;line-height:.9;text-align:center}
#cover p{font-family:Anton,sans-serif;text-transform:uppercase;font-style:italic;font-weight:300;font-size:clamp(18px,2.4vw,28px);color:#333}
#cover button{border:1px solid var(--ink);background:none;padding:14px 38px;border-radius:3px;font:500 13px/1 Barlow;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.3s}
#cover button:hover{background:var(--ink);color:#fff}
nav{position:fixed;top:0;left:0;right:0;z-index:60;transform:translateZ(0);text-shadow:0 1px 8px rgba(0,0,0,.9);display:flex;justify-content:space-between;align-items:center;padding:22px 32px;pointer-events:none}
nav .logo{font-family:Anton,sans-serif;text-transform:uppercase;font-size:17px;letter-spacing:-.01em;color:#cfcac1;text-decoration:none;pointer-events:auto;margin-top:4px}
nav .marka{display:flex;flex-direction:column;align-items:flex-start}
nav .hit{pointer-events:auto;font-family:Anton,sans-serif;text-transform:uppercase;font-size:28px;letter-spacing:-.02em;color:#ff5a1f;text-decoration:none;line-height:1}
nav .depth{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
/* ---- tünel ---- */
#world{position:fixed;inset:0;z-index:1;isolation:isolate;perspective:600px;perspective-origin:50% 50%;overflow:hidden}
#cam{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.obj{position:absolute;left:50%;top:50%;transform-style:preserve-3d;cursor:pointer;pointer-events:auto;will-change:transform,opacity}
.obj img{display:block;width:100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7));pointer-events:auto}

.vignette{display:none}
/* detay kartı */
#card{position:fixed;z-index:45;background:#f2efe9;color:#111;padding:10px 13px;border-radius:3px;width:210px;z-index:70;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
#card .k{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#666}
#card h3{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:18px;letter-spacing:-.01em;margin:3px 0 4px;line-height:1.1}
#card p{font-size:12px;color:#333;line-height:1.35}
#card .go{display:block;margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#111}
.hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);z-index:40;transition:.6s}
.hint.off{opacity:0}
#end{position:fixed;inset:0;display:grid;place-items:center;z-index:30;opacity:0;pointer-events:none;transition:.8s;font-family:Anton,sans-serif;text-transform:uppercase;font-weight:600;font-size:clamp(70px,20vw,320px);letter-spacing:-.05em;color:var(--accent)}
#end.on{opacity:1}
/* arama */
nav .sag{display:flex;gap:18px;align-items:center}
nav .ara-ac{pointer-events:auto;background:none;border:1px solid #444;color:var(--ink);border-radius:3px;padding:9px 18px;font:500 12px Barlow;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
nav .ara-ac:hover{border-color:var(--ink)}
#ara{position:fixed;inset:0;z-index:80;background:rgba(11,11,13,.97);display:none;flex-direction:column;touch-action:pan-y}
#ara.on{display:flex}
#ara .ust2{display:flex;gap:12px;align-items:center;padding:22px 32px 12px;max-width:1200px;width:100%;margin:0 auto}
#ara input{flex:1;min-width:0;background:#17171b;border:1px solid #2a2a30;color:var(--ink);border-radius:3px;padding:13px 20px;font:400 16px Barlow;outline:none}
#ara .kapat{background:none;border:1px solid #444;color:var(--ink);border-radius:3px;padding:12px 18px;font:500 12px Barlow;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
#ara .katlar{display:flex;gap:8px;flex-wrap:wrap;padding:4px 32px 16px;max-width:1200px;width:100%;margin:0 auto}
#ara .katlar button{background:none;border:1px solid #2a2a30;color:#aaa;border-radius:3px;padding:8px 14px;font:500 12px Barlow;cursor:pointer}
#ara .katlar button.on{background:var(--ink);color:#111;border-color:var(--ink)}
#ara .sonuc{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:4px 32px 40px;max-width:1200px;width:100%;margin:0 auto;align-content:start;touch-action:pan-y}
#ara .oge{background:#141417;border:1px solid #222;border-radius:3px;padding:12px;color:var(--ink);text-decoration:none;display:block}
#ara .oge:hover{border-color:#555}
#ara .oge img{width:100%;aspect-ratio:1;object-fit:contain;display:block;margin-bottom:10px}
#ara .oge b{display:block;font-weight:500;font-size:14px;line-height:1.25}
#ara .oge small{display:block;color:#888;font-size:11px;margin-top:4px}
#ara .yok{grid-column:1/-1;color:#888;text-align:center;padding:40px 0}
@media(max-width:600px){#ara .ust2,#ara .katlar,#ara .sonuc{padding-left:16px;padding-right:16px}#ara .sonuc{grid-template-columns:repeat(2,1fr);gap:10px}nav{padding:18px 16px}}

/* Hit Pazarı logosu: kırmızı çift eğik çizgi + HİT PAZARI (her sayfanın sol üstünde) */
html{font-synthesis:none}
.hpi-sol{display:flex;align-items:center;gap:12px;min-width:0}
.hp-logo{display:inline-flex;align-items:center;gap:.36em;flex:none;text-decoration:none;pointer-events:auto;color:#f2efe9;font:400 22px/1 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;white-space:nowrap;text-shadow:none}
.hp-satir{display:flex;align-items:center;gap:4px;min-width:0}
.hp-ac{flex:none;display:grid;place-items:center;width:40px;height:40px;margin:0;padding:0;background:none;border:0;color:#f2efe9;cursor:pointer;pointer-events:auto}
.hp-ac::before{content:"";width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.hp-ac[aria-expanded="true"]::before{transform:rotate(225deg) translate(-2px,-2px)}
.hp-ac:hover{color:#e8201c}
.hp-logo .hp-c{color:#e8201c;font-size:1.1em;letter-spacing:-.04em;transform:skewX(-14deg)}
/* vintage dili: Anton başlık, Barlow gövde, kırmızı vurgu */
nav .logo{font:700 15px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.24em;color:#cfcac1;margin-top:0;padding-left:12px;border-left:1px solid #55555e}
nav .depth,.hint{font-family:"Barlow Condensed",sans-serif;font-weight:700}
nav .ara-ac,#ara .kapat{border-color:#55555e;font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.2em}
#ara .katlar button{font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
#ara .oge{background:#141418;border-color:#26262c}
#ara .oge b{font-weight:600}
#card{background:#ece5d2}
#card h3{font-size:20px;letter-spacing:.01em;line-height:1.12}
#card .go{color:#e8201c;font-weight:700}
#end{font-weight:400;letter-spacing:0;transform:skewX(-8deg)}
nav{background:linear-gradient(#0b0b0de6,#0b0b0d00);padding-bottom:34px}
nav .hp-logo{text-shadow:0 1px 8px rgba(0,0,0,.9)}
@media(max-width:600px){.hp-logo{font-size:19px}nav .logo{font-size:13px;letter-spacing:.16em;padding-left:9px}nav .sag{gap:10px}.hpi-sol{gap:9px}}

/* tünel başlığı: Hit Pazarı logosu 2 kat, dükkân adı alt satırda 3 kat büyük ve kırmızı */
.hpi-sol{flex-direction:column;align-items:flex-start;gap:9px}
nav .hp-logo{font-size:42.5px}
nav .logo{font:400 51px/1.08 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#e8201c;border-left:0;padding-left:0;margin-top:0}
@media(max-width:600px){.hpi-sol{gap:3px}nav .hp-logo{font-size:20px}nav .logo{font-size:14px;letter-spacing:.01em}nav .ara-ac{font-size:16px!important;padding:10px 12px!important}}
nav .ara-ac{font-size:28px!important;padding:18px 36px!important;letter-spacing:.16em!important}
@media(max-width:600px){nav .ara-ac{font-size:16px!important;padding:10px 12px!important}}
/* ara: dükkân içi gibi beyaz, çerçevesiz, dekupe ürünler */
#kgiris{position:fixed;inset:0;z-index:30;display:none;place-items:center;pointer-events:none;transition:opacity .6s,transform .9s cubic-bezier(.3,0,.2,1)}
#kgiris.on{display:grid}#kgiris.off{opacity:0;transform:scale(1.6)}
#kgiris div{display:flex;flex-direction:column;align-items:center;gap:14px}
#kgiris img{height:min(46vh,480px);max-width:70vw;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.8))}
#kgiris b{font:400 clamp(56px,9vw,150px)/1 Anton,Impact,sans-serif;text-transform:uppercase;color:#e8201c;text-shadow:0 4px 30px #000}
#kperde{position:fixed;inset:0;z-index:90;background:#0b0b0d;opacity:0;pointer-events:none;transition:opacity .55s ease-in}
#kperde.on{opacity:1}
.deste-ac{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:55;display:flex;flex-direction:column;align-items:center;gap:4px;background:#1b2fa0;color:#fff;text-decoration:none;padding:14px 30px 12px;font:400 24px/1 Anton,Impact,sans-serif;letter-spacing:.02em;box-shadow:0 12px 30px #000a;white-space:nowrap}
.deste-ac small{font:700 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.deste-ac:hover{background:#e8201c}
.deste-ac[hidden]{display:none}

#hint{bottom:110px}
#ara{background:#fff;color:#111114}
#ara input{background:#fff;border:0;border-bottom:2px solid #111114;border-radius:0;color:#111114;font:500 20px Barlow;padding:12px 2px}
#ara input::placeholder{color:#8a8a92}
#ara .kapat{border-color:#c9c9d0;color:#111114}
#ara .katlar button{border-color:#c9c9d0;color:#111114;background:#fff}
#ara .katlar button.on{background:#e8201c;border-color:#e8201c;color:#fff}
#ara .sonuc{gap:30px 22px}
#ara .oge{background:none;border:0;border-radius:0;padding:0;color:#111114;text-align:center}
#ara .oge:hover{border:0}

#ara .oge:hover img{transform:translateY(-5px) scale(1.03)}

#ara .oge small{color:#77777f}
#ara .yok{color:#77777f}
#ara .ara-bas{display:flex;align-items:baseline;gap:14px;padding:18px 32px 0;max-width:1200px;width:100%;margin:0 auto}
#ara .ara-bas .hp-logo{color:#111114;text-shadow:none;font-size:30px;display:inline-flex!important}
#ara .ara-bas .hp-a{display:inline!important}
#ara .ara-bas b{font:400 30px/1 Anton,Impact,sans-serif;text-transform:uppercase;color:#e8201c}
#ara .ust2{padding-top:10px}

#ara .katlar{align-items:center}
#ara .katlar button.b1{font-size:26px;padding:14px 22px}
#ara .katlar button.b2{font-size:19px;padding:11px 17px}

@view-transition{navigation:auto}

.hp-menu{position:fixed;top:clamp(104px,16vh,190px);left:16px;z-index:95;width:min(340px,calc(100vw - 32px));background:#0b0b0df5;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #2a2a30;box-shadow:0 30px 60px #000c;padding:6px 0}
.hp-menu a{display:block;padding:11px 20px;text-decoration:none;color:#f2efe9;border-left:3px solid transparent}
.hp-menu a b{display:block;font:400 21px/1.1 Anton,sans-serif;text-transform:uppercase}
.hp-menu a small{display:block;margin-top:2px;font-size:12.5px;color:#9a958d}
.hp-menu a:hover,.hp-menu a:focus-visible{background:#16161a;border-left-color:#e8201c}
.hpm-dukkan{display:flex;flex-wrap:wrap;align-items:baseline;width:100%;background:none;border:0;border-left:3px solid transparent;padding:11px 20px;color:#f2efe9;text-align:left;cursor:pointer;font:inherit}
.hpm-dukkan b{font:400 21px/1.1 Anton,sans-serif;text-transform:uppercase}
.hpm-dukkan b::after{content:"";display:inline-block;width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);margin-left:12px;transition:transform .2s}
.hpm-dukkan[aria-expanded="true"] b::after{transform:rotate(225deg) translate(-1px,-1px)}
.hpm-dukkan small{flex-basis:100%;margin-top:2px;font-size:12.5px;color:#9a958d}
.hpm-dukkan:hover,.hpm-dukkan:focus-visible{background:#16161a;border-left-color:#e8201c}
.hp-menu .hpm-liste{margin:2px 0 6px 20px;border-left:1px solid #2a2a30}
.hp-menu .hpm-liste a{padding:9px 18px;color:#cfcac1;border-left:0}
.hp-menu .hpm-liste a b{font-size:19px}

/* tema: Gece (varsayılan) / Gündüz, tünel menüsünden seçilir */
.hpm-sec{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:9px 18px;color:#cfcac1;cursor:pointer;text-align:left;font:inherit}

.hpm-sec:hover,.hpm-sec:focus-visible{background:#16161a}
.hpm-sec[aria-pressed="true"]{color:#e8201c}
.hpm-sec[aria-pressed="true"]::after{content:"✓";font-size:17px;font-weight:700}

html[data-tema="gunduz"] .hp-menu a,html[data-tema="gunduz"] .hpm-dukkan,html[data-tema="gunduz"] .hp-menu .hpm-liste a,html[data-tema="gunduz"] .hpm-sec{color:#111114}

html[data-tema="gunduz"] .hp-menu a:hover,html[data-tema="gunduz"] .hp-menu a:focus-visible,html[data-tema="gunduz"] .hpm-dukkan:hover,html[data-tema="gunduz"] .hpm-dukkan:focus-visible,html[data-tema="gunduz"] .hpm-sec:hover,html[data-tema="gunduz"] .hpm-sec:focus-visible{background:#f1f1f3}

html[data-tema="gunduz"] #kgiris b{text-shadow:none}

  if(card.classList.contains('on')&&(Math.abs(target-kartZ)>30||!drawn.includes(hot)))kartKapa();   // kaydırınca açıklama kapanır
  if(lx>=0){const n=performance.now();if(n-hoverSon>=90){hoverSon=n;hover()}}
  if(camZ!==target||kirli)requestAnimationFrame(render);
  else{calisiyor=false;if(lx>=0)hover();if(typeof konumKaydet==='function')konumKaydet()}   // hiçbir şey kıpırdamıyorsa çizim durur
}

// --- seçim: o noktada gerçekten görünen, en öndeki ürün ---
const card=document.getElementById('card'); let hoverT=null,hot=null;
function pickIs(it,x,y){
  const d=ALPHA[it.u[0]]; if(!d||it.op<0.05)return false;
  const dx=x-it.sx, dy=y-it.sy, c=Math.cos(it.rot), s=Math.sin(it.rot);
  const lx_=dx*c+dy*s, ly_=-dx*s+dy*c;                 // eğimi geri al
  const u=Math.floor((lx_/it.sw+0.5)*48), v=Math.floor((ly_/it.sh+0.5)*48);
  if(u<0||u>47||v<0||v>47)return false; return d[(v*48+u)*4+3]>40}
function pick(x,y){ for(let j=drawn.length-1;j>=0;j--){ if(pickIs(drawn[j],x,y))return drawn[j] } return null }
// menü açıkken ürün kartı görünmez; menü açılınca kart kapanır, tünel durur (Tolga 17.11)
const menuAcik=()=>['hikMenu','hpMenu'].some(i=>{const m=document.getElementById(i);return m&&!m.hidden})||!!(window.tunelKurAcik&&tunelKurAcik());
{const izle=new MutationObserver(()=>{if(menuAcik()){clearTimeout(hoverT);card.classList.remove('on');hot=null;open=false}else if(!document.getElementById('ara').classList.contains('on'))open=true});
 ['hikMenu','hpMenu'].forEach(i=>{const m=document.getElementById(i);if(m)izle.observe(m,{attributes:true,attributeFilter:['hidden']})})}
// ürün kartı ekrandan taşmaz ve alttaki 'Kaydır, seç' düğmesinin üstüne binmez
function kartYer(x,y){const w=card.offsetWidth,h=card.offsetHeight,dg=document.getElementById('desteAc'),dr=dg&&getComputedStyle(dg).display!=='none'&&dg.getBoundingClientRect().height>0?dg.getBoundingClientRect():null;
  const alt=(dr?dr.top:innerHeight)-14;card.style.left=Math.max(8,Math.min(x+16,innerWidth-w-8))+'px';card.style.top=Math.max(8,Math.min(y+16,alt-h))+'px'}
function showCard(it,x,y){if(menuAcik())return;hot=it;kartZ=target;document.getElementById('c-k').textContent=KMOD?'Kategori':[(typeof KATEGORI!=='undefined'&&KATEGORI[it.u[0]])||'',it.u[3]==='—'?'':it.u[3]].filter(Boolean).join(' · ');document.getElementById('c-h').textContent=it.u[1];document.getElementById('c-p').textContent=it.u[2];kartYer(x,y);card.classList.add('on')}
// fare gezince açıklama çıkmaz, yalnız imleç değişir. İlk tıklama açıklama, aynı ürüne ikinci tıklama ürün sayfası
let kartZ=0;
function kartKapa(){card.classList.remove('on');hot=null}
function urunAc(o){location.href='urun.html?id='+encodeURIComponent(o.u[0])}
function nearHot(x,y){if(!hot||!drawn.includes(hot))return false;for(const [ox,oy] of [[0,0],[7,0],[-7,0],[0,7],[0,-7],[5,5],[-5,5],[5,-5],[-5,-5]])if(pickIs(hot,x+ox,y+oy))return true;return false}
let lx=-1,ly=-1;
function hover(){if(lx<0)return;cv.style.cursor=pick(lx,ly)?'pointer':''}
addEventListener('mousemove',e=>{lx=e.clientX;ly=e.clientY;hover()});
card.addEventListener('click',()=>{if(hot)urunAc(hot)});
addEventListener('keydown',e=>{if(e.key==='Escape')kartKapa()});
cv.addEventListener('click',e=>{const X=e.clientX,Y=e.clientY;if(!KMOD&&card.classList.contains('on')&&nearHot(X,Y)){urunAc(hot);return}const o=pick(X,Y);if(!o){kartKapa();return}{if(KMOD){target=clamp(camZ+1600);document.getElementById('kperde').classList.add('on');setTimeout(()=>location.href=SKAT.has(o.u[1])?'index.html?sec='+encodeURIComponent(o.u[1]):'index.html?kat='+encodeURIComponent(o.u[1]),620)}else showCard(o,X,Y)}});   // telefonda da bilgisayarda da Hit Pazarı ürün sayfası (Halalar destesine değil)
// ürüne dokununca kart destesi (Geç / Teklif / Satın al / Beğen) o üründen başlar: telefon uygulamasının destesi
document.getElementById('desteAc').onclick=e=>{e.preventDefault();location.href=desteAdres((items.find(it=>it.dz>-1500&&it.dz<200)||items[0]).u[0])};
if(KMOD)document.getElementById('desteAc').hidden=true;
function desteAdres(id){const p=location.port,yerel={'8766':'8769','8770':'8771'}[p];
  const kok=yerel?`${location.protocol}//${location.hostname}:${yerel}/`:'https://tolgaarpa.github.io/halalar-app/';
  // deste, girilen tünelin ürünleriyle açılır: t=pazar | dukkan:2 | dukkan:3 | sec:<seçim> | kat:<Halalar kategorisi> | (boş = Halalar)
  const q=new URLSearchParams(location.search);
  const t=KPAZAR?'pazar':(KDT&&KDT.length)?'dukkan:'+KDS:(KST&&KST.length)?'sec:'+q.get('sec'):(KFILTRE&&KFILTRE.length)?'kat:'+KSEC:/^d[23]:/.test(id||'')?'pazar':'';
  const z=Math.round(camZ);return kok+'index.html'+(t?'?t='+encodeURIComponent(t):'')+(z>0?(t?'&':'?')+'z='+z:'')+'#u='+encodeURIComponent(id)}
target=parseFloat(new URLSearchParams(location.search).get('z')||0);
// bulunduğun derinlik adreste tutulur (?z=): ürüne, desteye, menüye gidip geri dönünce tünel aynı noktadan açılır
function konumKaydet(){if(typeof camZ==='undefined')return;const q=new URLSearchParams(location.search),z=Math.round(target);if(q.get('z')===String(z))return;if(z>0)q.set('z',z);else q.delete('z');const s=q.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''))}
addEventListener('click',konumKaydet,true);addEventListener('pagehide',konumKaydet);document.addEventListener('visibilitychange',()=>{if(document.hidden)konumKaydet()});

// --- arama ve kategoriler ---
(()=>{// dükkân tünelinde (?dukkan=) arama yalnız o dükkânın ürünlerinde ve kategorilerinde
  // Pazar ve 'Kendi tünelin'de arama bütün dükkânlarda (Halalar + DSG + Önsal)
  const DM=!!(KDT&&KDT.length),HEPSI=!DM&&(KPAZAR||!!(KST&&KST.length)),DKAT={};
  const EKL=HEPSI?[].concat(typeof DUKKAN2!=='undefined'?dukT('d2:',DUKKAN2):[],typeof DUKKAN3!=='undefined'?dukT('d3:',DUKKAN3):[]):[];
  const AL=DM?KDT:HEPSI?URUNLER.concat(EKL):URUNLER;(DM?KDT:EKL).forEach(u=>DKAT[u[0]]=u[3]);
  const KAT=id=>DKAT[id]||(typeof KATEGORI!=='undefined'&&KATEGORI[id])||'';
  const kutu=document.getElementById('araKutu'),kl=document.getElementById('katlar'),so=document.getElementById('sonuc'),pen=document.getElementById('ara');let kat='';
  const norm=t=>(t||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // popülerlik (şimdilik kategorideki ürün sayısı) sırasıyla; ilk 3 büyük, sonraki 4 orta, kalanı küçük
  const SAY={};AL.forEach(u=>{const k=KAT(u[0]);if(k)SAY[k]=(SAY[k]||0)+1});
  const KS=(DM?KD[1].kategoriler:[].concat(typeof KATEGORILER!=='undefined'?KATEGORILER:[],HEPSI&&typeof DUKKAN2!=='undefined'?DUKKAN2.kategoriler:[],HEPSI&&typeof DUKKAN3!=='undefined'?DUKKAN3.kategoriler:[])).filter(k=>SAY[k]).slice().sort((a,b)=>(SAY[b]||0)-(SAY[a]||0));
  kl.innerHTML=`<button data-k="" class="on b3">Tümü</button>`+KS.map((k,i)=>`<button data-k="${esc(k)}" class="${i<3?'b1':i<7?'b2':'b3'}">${esc(k)}</button>`).join('');
  kl.onclick=e=>{const b=e.target.closest('button');if(!b)return;kat=b.dataset.k;kl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));goster()};
  function goster(){const q=norm(kutu.value).trim();
    const L=AL.filter(u=>(!kat||KAT(u[0])===kat)&&(!q||q.split(/\s+/).every(w=>norm(u[1]+' '+u[2]+' '+u[3]+' '+KAT(u[0])).includes(w))));
    // önem sırası: beğendiklerin önce, sonra popüler kategoriler; ilk satır 4, sonra 5, sonra 6'şar (kademeli küçülür)
    {let B=[];try{B=(JSON.parse(localStorage.getItem('halalar-app-v1'))||{}).begeni||[]}catch(e){}const puan=u=>(B.includes(u[0])?1000:0)+(SAY[KAT(u[0])]||0);L.sort((x,y)=>puan(y)-puan(x))}
    const kd=i=>i<4?'s4':i<9?'s5':'s6';
    so.innerHTML=L.length?L.map((u,i)=>`<a class="oge ${kd(i)}" href="urun.html?id=${encodeURIComponent(u[0])}"><img class="${window.HPK?HPK.sinif(u[0]):''}" loading="lazy" src="${esc(GOR[u[0]]||'kaynak/web/'+u[0]+'.webp')}" alt=""><b>${esc(u[1])}</b><small>${esc((DM||/^d[23]:/.test(u[0])?[KAT(u[0])]:[KAT(u[0]),u[3]==='—'?'':u[3]]).filter(Boolean).join(' · '))}</small></a>`).join(''):'<div class="yok">Sonuç yok</div>'}
  kutu.oninput=goster;
  document.getElementById('araAc').onclick=()=>{pen.classList.add('on');open=false;card.classList.remove('on');goster();setTimeout(()=>kutu.focus(),50)};
  document.getElementById('araKapat').onclick=()=>{pen.classList.remove('on');open=true};
  addEventListener('tunelkur',e=>{open=!e.detail;if(e.detail)card.classList.remove('on')});
  addEventListener('keydown',e=>{if(e.key==='Escape'&&pen.classList.contains('on'))document.getElementById('araKapat').click()});
})();

<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="theme-color" content="#ffffff"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hit Pazarı · Dükkân</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%230b0b0d%27/%3E%3Cpath d=%27M16 48 28 16M30 48 42 16%27 stroke=%27%23e8201c%27 stroke-width=%278%27 stroke-linecap=%27square%27/%3E%3C/svg%3E">
<style>
:root{--bg:#ffffff;--ink:#111114;--yumusak:#4a4a52;--muted:#77777f;--line:#e4e4e8;--panel:#ffffff;--accent:#e8201c;--mavi:#1b2fa0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:Barlow,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit}
nav{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 32px;border-bottom:1px solid var(--line)}
nav a{text-decoration:none}
.hp-logo{display:inline-flex;align-items:center;gap:.36em;color:#111114;font:400 30px/1 Anton,"Arial Narrow",Impact,sans-serif;white-space:nowrap}
.hp-logo .hp-c{color:var(--accent);font-size:1.1em;letter-spacing:-.04em;transform:skewX(-14deg)}
.back{font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--yumusak);white-space:nowrap}
.sar{max-width:1240px;margin:0 auto;padding:0 32px}
header.bas{padding:64px 0 34px}
header.bas h1{font:400 clamp(56px,9vw,128px)/.95 Anton,sans-serif;text-transform:uppercase;color:var(--accent);letter-spacing:.005em}
header.bas p{margin-top:16px;font-size:clamp(18px,1.8vw,22px);color:var(--yumusak);max-width:46ch}
.kat{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.kat button{background:none;border:1px solid #c9c9d0;color:var(--ink);font:700 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;cursor:pointer}
.kat button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.raf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:34px 24px;padding:16px 0 80px}
.urun{display:flex;flex-direction:column;text-decoration:none}
.urun .g img{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.urun:hover .g img{transform:translateY(-6px) scale(1.03)}
.urun:hover h2{color:var(--accent)}
.urun .g{position:relative;aspect-ratio:1;width:100%}
.urun img{position:absolute;left:8%;top:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(0,0,0,.14))}
.urun .b{padding:6px 4px 10px;text-align:center}
.urun small{font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.urun h2{font:600 17px/1.25 Barlow,sans-serif;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.urun .f{font:400 24px/1 Anton,sans-serif;margin-top:10px}
.bos{grid-column:1/-1;padding:48px 34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center}
.bos h2{font:400 clamp(34px,4vw,56px)/1 Anton,sans-serif;text-transform:uppercase}
.bos p{margin-top:14px;color:var(--yumusak);font-size:18px;line-height:1.5;max-width:52ch}
.bos .rafl{display:flex;gap:10px}
.bos .rafl span{width:62px;height:150px;border:1px solid #c9c9d0;background:repeating-linear-gradient(#f4f4f6 0 34px,#d8d8de 34px 36px)}
.guven{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:0 0 70px}
.guven div{border-top:3px solid var(--accent);padding-top:14px}
.guven b{display:block;font:400 22px/1.1 Anton,sans-serif;text-transform:uppercase}
.guven p{margin-top:8px;color:var(--yumusak);font-size:16px;line-height:1.5}
footer{border-top:1px solid var(--line);padding:30px 32px;display:flex;flex-wrap:wrap;gap:12px 28px;font-size:14px;color:var(--muted)}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:700px){nav{padding:16px}.sar{padding:0 16px}.hp-logo{font-size:22px}header.bas{padding:40px 0 24px}
  .raf{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.urun .b{padding:4px 2px 8px}.urun h2{font-size:15px}.urun .f{font-size:20px}
  .bos{grid-template-columns:1fr;padding:30px 20px}.bos .rafl{display:none}.guven{grid-template-columns:1fr}footer{padding:24px 16px}}
</style><script>/* yerel deneme (bilgisayar/ev ağı): canlı site adreslerini yerel kopyaya çevir; canlıda hiçbir şey yapmaz */(()=>{const y={'8766':['8766','8769'],'8769':['8766','8769'],'8770':['8770','8771'],'8771':['8770','8771']}[location.port];if(!y)return;const o=location.protocol+'//'+location.hostname+':';const f=h=>String(h).replace('https://tolgaarpa.github.io/halalar-web/',o+y[0]+'/').replace('https://tolgaarpa.github.io/halalar-app/',o+y[1]+'/');window.yerelCevir=f;const d=()=>document.querySelectorAll('a[href^="https://tolgaarpa.github.io/"]').forEach(a=>a.setAttribute('href',f(a.getAttribute('href'))));new MutationObserver(d).observe(document.documentElement,{subtree:true,childList:true});addEventListener('DOMContentLoaded',d)})()</script>
</head><body>
<nav><a class="hp-logo" href="hit.html" aria-label="Hit Pazarı"><span class="hp-c" aria-hidden="true">//</span><span>HİT PAZARI</span></a><a class="back" href="hit.html#dukkanlar">← Dükkânlar</a></nav>
<script src="veri/hesap-ikon.js"></script>
<div class="sar">
  <header class="bas"><h1 id="ad"></h1><p id="slogan"></p><div class="kat" id="kat"></div></header>
  <main class="raf" id="raf"></main>
  <section class="guven" aria-label="Alışveriş bilgisi">
    <div><b>Stoktan gönderim</b><p id="teslim"></p></div>
    <div><b>14 gün cayma hakkı</b><p>Ürünü teslim aldıktan sonra 14 gün içinde gerekçe göstermeden iade edebilirsin.</p></div>
    <div><b>Faturalı satış</b><p>Her siparişe fatura kesilir. Ayrıntılar <a href="satis-kosullari.html">satış koşullarında</a>.</p></div>
  </section>
</div>
<footer><a href="hit.html">Hit Pazarı</a><a href="satis-kosullari.html">Satış koşulları ve cayma hakkı</a><a href="https://tolgaarpa.github.io/halalar-app/kvkk.html">Aydınlatma metni</a></footer>
<script src="veri/dukkan2.js"></script>
<script src="veri/dukkan3.js"></script>
<script>
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TL=n=>(n||0).toLocaleString('tr-TR')+' ₺';
const D3=new URLSearchParams(location.search).get('d')==='3'&&typeof DUKKAN3!=='undefined',D=D3?DUKKAN3:DUKKAN2,ON=D3?'d3:':'d2:';document.title='Hit Pazarı · '+D.ad;
document.getElementById('ad').textContent=D.ad;document.getElementById('slogan').textContent=D.slogan;document.getElementById('teslim').textContent=D.teslim+'. Kargo takip bilgisi telefonuna gelir.';
let sec='Hepsi';
const kat=document.getElementById('kat');
['Hepsi'].concat(D.kategoriler).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;b.className=k===sec?'on':'';
  b.onclick=()=>{sec=k;kat.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));ciz()};kat.appendChild(b)});
function ciz(){const raf=document.getElementById('raf');const l=D.urunler.filter(u=>u.stok!==0&&(sec==='Hepsi'||u.kategori===sec));
  if(!D.urunler.length){raf.innerHTML=`<div class="bos"><div><h2>Raflar dolduruluyor</h2><p>${esc(D.kategoriler.join(', '))} ürünleri çok yakında burada. Şimdilik Halalar'ın tünelinde gezebilirsin.</p><p><a href="index.html">Halalar tüneline gir →</a></p></div><div class="rafl" aria-hidden="true"><span></span><span></span><span></span></div></div>`;return}
  if(!l.length){raf.innerHTML='<div class="bos"><div><h2>Bu rafta şu an ürün yok</h2><p>Başka bir kategoriye bak.</p></div></div>';return}
  raf.innerHTML=l.map(u=>`<a class="urun" href="urun.html?id=${encodeURIComponent(ON+u.id)}"><div class="g"><img src="${esc(u.gorsel)}" alt="${esc(u.ad)}" loading="lazy" referrerpolicy="no-referrer"></div><div class="b"><small>${esc(u.kategori)}</small><h2>${esc(u.ad)}</h2><div class="f">${u.fiyat?TL(u.fiyat):'Teklif ver'}</div></div></a>`).join('')}
ciz();
</script>
</body></html>

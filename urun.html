{const b=document.querySelector('nav .back'),r=document.referrer,ic=r&&r.indexOf(location.origin)===0&&r.split('#')[0]!==location.href.split('#')[0];

function ac(tur){
  tamam.hidden=true;form.hidden=false;bT.classList.toggle('on',tur==='teklif');bA.classList.toggle('on',tur==='alim');
  if(tur==='teklif'){const o=[.7,.8,.9].map(r=>Math.round(FY*r/50)*50);
    form.innerHTML=`<h2>Teklif ver</h2><div class="tutar"><input id="tk" inputmode="numeric" aria-label="Teklif tutarı" value="${o[1]||''}"><span>₺</span></div>
      <div class="hizli">${o.filter(v=>v>0).map(v=>`<button type="button" data-v="${v}">${TL(v)}</button>`).join('')}</div>${kisiHTML()}
      <p class="not">Teklifin dükkâna iletilir; dükkân seni telefonla arar. Durumu Hit Pazarı'nda "Teklif ve taleplerim"de görürsün.</p>
      <div class="hata" id="khata"></div><div class="dug"><button class="cta" type="button" id="vz">Vazgeç</button><button class="cta on" type="submit" id="gn">Teklifi gönder</button></div>`;
    form.querySelectorAll('.hizli button').forEach(b=>b.onclick=()=>{document.getElementById('tk').value=b.dataset.v})}
  else{form.innerHTML=`<h2>Satın al</h2><div class="ozet"><div><span>Ürün</span><span>${TL(FY)}</span></div><div><span>Teslimat</span><span>${D2?esc(DK.teslim):'Dükkândan teslim'}</span></div><div><b>Toplam</b><b>${TL(FY)}</b></div></div>${kisiHTML()}
      <p class="not">${D2?'Siparişin bize düşer; seni arayıp ödeme ve teslimat adresini teyit ederiz. <a href="satis-kosullari.html" target="_blank" rel="noopener">Satış koşulları ve cayma hakkı</a>.':'Burada ödeme alınmaz; talebin dükkâna düşer, dükkân seni arayıp ürünü ayırır.'}</p>
      <div class="hata" id="khata"></div><div class="dug"><button class="cta" type="button" id="vz">Vazgeç</button><button class="cta on" type="submit" id="gn">Satın alma talebini gönder</button></div>`}
  form.dataset.tur=tur;document.getElementById('vz').onclick=kapat;
  (tur==='teklif'?document.getElementById('tk'):document.getElementById('kad')).focus()}
function kapat(){form.hidden=true;bT.classList.remove('on');bA.classList.remove('on')}
bT.onclick=()=>ac('teklif');bA.onclick=()=>ac('alim');
form.onsubmit=async e=>{e.preventDefault();const tur=form.dataset.tur,h=document.getElementById('khata');h.textContent='';
  const tutar=tur==='teklif'?(parseInt((document.getElementById('tk').value||'').replace(/\D/g,''))||0):FY;
  if(tutar<=0){h.textContent='Teklif tutarını yaz.';return}
  const ad=document.getElementById('kad').value.trim(),tel=document.getElementById('ktel').value.replace(/[^0-9+]/g,'');
  if(ad.length<2){h.textContent='Adını yaz, dükkân sana böyle hitap edecek.';return}
  if(tel.replace(/\D/g,'').length<10){h.textContent='Telefon numaranı 10-11 hane olarak yaz.';return}
  if(!document.getElementById('krz').checked){h.textContent='Göndermek için aydınlatma metnini onaylaman gerekiyor.';return}
  if(!VT){h.textContent='Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.';return}
  const btn=document.getElementById('gn'),eski=btn.textContent;btn.disabled=true;btn.textContent='Gönderiliyor…';
  try{const r=await VT.collection('talepler').add({urun:u[0],urunAd:((D2&&D2.tamAd)||u[1]).slice(0,120),tur,tutar,ad,tel,durum:'Beklemede',zaman:firebase.firestore.FieldValue.serverTimestamp(),satici:SATICI});
    yaz(x=>{x.kisi={ad,tel,rza:true};x.islem=x.islem||[];x.islem.unshift({id:u[0],ref:r.id,satici:SATICI,tur,tutar,zaman:Date.now(),durum:'Beklemede'})});
    form.hidden=true;bT.classList.remove('on');bA.classList.remove('on');tamam.hidden=false;
    tamam.innerHTML=`<b>${tur==='teklif'?'Teklifin gönderildi: '+TL(tutar):'Satın alma talebin gönderildi'}</b><p>Dükkân seni ${esc(tel)} numarasından arayacak. Durumu <a href="hit.html#hesap">Hit Pazarı › Teklif ve taleplerim</a>'den takip edebilirsin.</p>`;
    tamam.focus&&tamam.scrollIntoView({block:'nearest',behavior:'smooth'})}
  catch(err){console.warn(err);h.textContent='Gönderilemedi. İnternetini kontrol edip tekrar dene.';btn.disabled=false;btn.textContent=eski}};
</script>
<script src="veri/oneri.js"></script>
<script src="veri/uye.js"></script>
</body></html>

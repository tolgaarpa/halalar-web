<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halalar · Ürün</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--accent:#1f22ff;--muted:#777}*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 32px}
nav a{color:var(--ink);text-decoration:none}.logo{font-family:Fraunces,serif;font-size:26px;letter-spacing:-.02em}
.back{font-size:12px;letter-spacing:.3em;text-transform:uppercase}
main{display:grid;grid-template-columns:1.1fr 1fr;gap:6vw;align-items:center;padding:4vh 6vw 10vh;min-height:80vh}
main img{width:100%;max-height:72vh;object-fit:contain;filter:drop-shadow(0 40px 60px rgba(0,0,0,.25))}
.k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Fraunces,serif;font-weight:300;font-size:clamp(40px,6vw,96px);letter-spacing:-.03em;line-height:.95;margin:14px 0 22px}
p{font-size:18px;line-height:1.5;color:#333;max-width:40ch}
.cta{display:inline-block;margin-top:34px;border:1px solid var(--ink);padding:14px 30px;border-radius:999px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.cta:hover{background:var(--ink);color:#fff}
.foto{min-width:0}
.acilar{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center}
.acilar button{width:64px;height:64px;border:1px solid #e3e0da;border-radius:10px;background:#f6f4f0;padding:5px;cursor:pointer}
.acilar button.on{border-color:var(--ink)}
.acilar img{width:100%;height:100%;object-fit:contain;filter:none;max-height:none}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style></head>
<body>
<nav><a class="logo" href="index.html#ic">Halalar</a><a class="back" href="index.html#ic">← tünele giriş</a></nav>
<main><div class="foto"><img id="img" alt=""><div class="acilar" id="acilar"></div></div><div><div class="k" id="k"></div><h1 id="h"></h1><p id="p"></p><a class="cta" href="#">Sor / Rezerve et</a></div></main>
<script src="veri/urunler.js"></script>
<script src="veri/galeri.js"></script>
<script src="veri/kategoriler.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');const u=URUNLER.find(x=>x[0]===id)||URUNLER[0];
const fotolar=[`kaynak/web/${u[0]}.webp`].concat(((typeof GALERI!=='undefined'&&GALERI[u[0]])||[]).map(g=>`kaynak/web/${g}.webp`));
const ana=document.getElementById('img');ana.src=fotolar[0];
const kat=(typeof KATEGORI!=='undefined'&&KATEGORI[u[0]])||'';
document.getElementById('k').textContent=[kat,u[3]==='—'?'':u[3]].filter(Boolean).join(' · ')||'Halalar koleksiyonu';
document.getElementById('h').textContent=u[1];document.getElementById('p').textContent=u[2];document.title='Halalar · '+u[1];
if(fotolar.length>1){const kutu=document.getElementById('acilar');
  fotolar.forEach((f,i)=>{const b=document.createElement('button');b.className=i?'':'on';b.setAttribute('aria-label',(i+1)+'. açı');
    const im=document.createElement('img');im.src=f;im.alt='';im.loading='lazy';b.appendChild(im);
    b.onclick=()=>{ana.src=f;kutu.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};kutu.appendChild(b)})}
</script>
</body></html>

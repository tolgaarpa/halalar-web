<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>Hit Pazarı · Kategorini seç</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%230b0b0d%27/%3E%3Cpath d=%27M16 48 28 16M30 48 42 16%27 stroke=%27%23e8201c%27 stroke-width=%278%27 stroke-linecap=%27square%27/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b0d;--ink:#f2efe9;--yumusak:#cfcac1;--accent:#e8201c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);height:100%;overflow:hidden}
body{color:var(--ink);font-family:Barlow,system-ui,sans-serif}
nav{position:fixed;top:0;left:0;right:0;z-index:5000;display:flex;justify-content:space-between;align-items:center;padding:20px 32px;background:linear-gradient(#0b0b0de6,#0b0b0d00)}
nav a{text-decoration:none;color:inherit}
.hp-logo{display:inline-flex;align-items:center;gap:.36em;font:400 30px/1 Anton,Impact,sans-serif;white-space:nowrap;text-shadow:0 1px 8px #000}
.hp-logo .hp-c{color:var(--accent);font-size:1.1em;letter-spacing:-.04em;transform:skewX(-14deg)}
.back{font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--yumusak)}
.sahne{position:fixed;inset:0;z-index:4500}
.kp{position:absolute;display:block;transform:translate(-50%,-50%);cursor:pointer;background:none;border:0;color:var(--ink);font:inherit;text-decoration:none;width:var(--g)}
.kp .ip{display:flex;flex-direction:column;align-items:center;gap:10px;transform-origin:50% -40px;animation:salla var(--s,5s) ease-in-out var(--d,0s) infinite alternate}
@keyframes salla{from{transform:rotate(-3deg) translateY(-4px)}to{transform:rotate(3deg) translateY(5px)}}
.kp img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 26px 26px rgba(0,0,0,.85));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.kp span{font:400 clamp(20px,1.9vw,30px)/1 Anton,sans-serif;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;text-shadow:0 2px 10px #000;padding:7px 12px;background:#0b0b0dcc;transition:background .2s}
.kp:hover img,.kp:focus-visible img{transform:scale(1.08)}
.kp:hover span,.kp:focus-visible span{background:var(--accent)}
.orta{position:fixed;inset:0;z-index:4000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 20px}
.orta h1{font:400 clamp(36px,min(4.8vw,8vh),84px)/.92 Anton,sans-serif;text-transform:uppercase;color:var(--accent);text-shadow:0 4px 30px #000}
.orta p{margin-top:16px;font-size:clamp(17px,1.6vw,21px);color:var(--yumusak);text-shadow:0 2px 14px #000}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:700px){html,body{overflow:auto;height:auto}nav{padding:16px}.hp-logo{font-size:22px}.orta{position:static;padding:96px 16px 8px}.orta h1{font-size:52px}.orta p{display:none}.sahne{position:static;display:grid;grid-template-columns:1fr 1fr;gap:30px 10px;padding:20px 12px 50px}.kp{position:static;transform:none;width:auto;justify-self:center}.kp img{width:118px}.kp span{font-size:16px;padding:5px 8px}}
@media(prefers-reduced-motion:reduce){.kp .ip{animation:none}}
</style></head><body>
<nav><a class="hp-logo" href="hit.html" aria-label="Hit Pazarı"><span class="hp-c" aria-hidden="true">//</span><span>HİT PAZARI</span></a><a class="back" href="hit.html">← Geri</a></nav>
<div class="sahne" id="sahne" aria-hidden="true"></div>
<div class="orta"><h1>Kategorini<br>seç</h1><p>Bir görsele dokun.</p></div>
<script src="veri/urunler.js"></script>
<script src="veri/kategoriler.js"></script>
<script src="veri/kategori-ikon.js"></script>
<script>
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const git=k=>location.href='index.html?kat='+encodeURIComponent(k);
const KATS=(typeof KATEGORILER!=='undefined'?KATEGORILER:Object.keys(KATEGORI_IKON)).filter(k=>KATEGORI_IKON[k]);
// görseller başlığın etrafında elips üstüne dizilir; havada asılı, hafifçe sallanır
const sahne=document.getElementById('sahne');
const EL=KATS.map((k,i)=>{const a=document.createElement('a');a.className='kp';a.href='index.html?kat='+encodeURIComponent(k);
  a.style.setProperty('--d',(-(i*0.73)%5).toFixed(2)+'s');a.style.setProperty('--s',(4.2+(i%4)*.6).toFixed(1)+'s');
  a.innerHTML=`<span class="ip"><img src="kaynak/web/${KATEGORI_IKON[k]}.webp" alt="" decoding="async"><span>${esc(k)}</span></span>`;
  sahne.appendChild(a);return a});
function diz(){const W=innerWidth,H=innerHeight,n=EL.length,dar=W<700;
  if(dar){EL.forEach(a=>{a.style.left=a.style.top='';a.style.removeProperty('--g')});return}
  // iki yay: üstte 5, altta 5; başlık ortada; kenardakiler başlığa doğru kıvrılır
  const ust=Math.ceil(n/2),g=Math.min(200,W*.13,H*.17);
  EL.forEach((a,i)=>{const alt=i>=ust,k=alt?i-ust:i,m=alt?n-ust:ust,u=(k+.5)/m,yay=Math.abs(u-.5)*2;
    a.style.setProperty('--g',g+'px');a.style.left=(W*(.08+.84*u))+'px';
    a.style.top=(alt?H*.81-yay*H*.08:H*.255+yay*H*.08)+'px'})}
diz();addEventListener('resize',diz);
</script>
</body></html>

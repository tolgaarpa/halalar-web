<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hit Pazarı · Sayfa bulunamadı</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
/* olmayan bir adrese gelen ziyaretçi GitHub'ın sayfası yerine bunu görür (Tolga 21.11) */
:root{--ink:#f2efe9;--paper:#0b0b0d;--muted:#8d887f;--accent:#e8201c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
.logo{font:400 22px/1 Anton,Impact,sans-serif;color:var(--ink);text-decoration:none;letter-spacing:.005em}.logo span{color:var(--accent);margin-right:.3em}
h1{font:400 clamp(44px,12vw,110px)/.95 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--accent)}
p{color:var(--muted);max-width:420px;line-height:1.5}
.yol{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.yol a{border:1px solid #55555e;color:var(--ink);text-decoration:none;padding:13px 22px 12px;font:400 17px/1 Anton,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.yol a.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
<script>try{if(localStorage.getItem('hp-tema')==='gunduz'){document.documentElement.style.setProperty('--paper','#fff');document.documentElement.style.setProperty('--ink','#111114')}}catch(e){}</script>
</head>
<body>
<a class="logo" href="/hitpazari/hit.html"><span>//</span>HİT PAZARI</a>
<h1>Bu sayfa yok</h1>
<p>Aradığın sayfa kaldırılmış ya da adres yanlış yazılmış olabilir. Pazardaki her şey hâlâ yerinde.</p>
<div class="yol"><a class="on" href="/hitpazari/index.html?mod=pazar">Pazara gir</a><a href="/hitpazari/hit.html">Ana sayfa</a></div>
</body>
</html>
